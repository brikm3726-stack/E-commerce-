name = "ecomdz-shopify-order"
main = "src/index.js"
compatibility_date = "2024-10-01"

# Renseigne ces valeurs dans le tableau de bord Cloudflare
# (Workers & Pages → ton worker → Settings → Variables and Secrets),
# PAS ici, pour ne pas exposer le jeton dans Git :
#   SHOPIFY_STORE        = "ma-boutique.myshopify.com"   (variable simple)
#   SHOPIFY_ADMIN_TOKEN  = "shpat_xxx"                    (Secret)
#   ALLOWED_ORIGIN       = "https://brikm3726-stack.github.io"
#   SHOPIFY_API_VERSION  = "2024-10"   (optionnel)

[vars]
ALLOWED_ORIGIN = "https://brikm3726-stack.github.io"
SHOPIFY_API_VERSION = "2024-10"
