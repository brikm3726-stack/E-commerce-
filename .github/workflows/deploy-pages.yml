name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  # permet aussi un lancement manuel depuis l'onglet Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l'export statique
        # NEXT_PUBLIC_ est indispensable : cette variable doit être lisible
        # à la fois par next.config.ts (build) et par le code qui tourne
        # dans le navigateur (loader d'images) — voir next.config.ts.
        env:
          NEXT_PUBLIC_GITHUB_PAGES: "true"
        run: npm run build

      - name: Marquer le dossier comme statique (pas de traitement Jekyll)
        run: touch ./out/.nojekyll

      - name: Préparer l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
