name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  # permet aussi un lancement manuel depuis l'onglet Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l'export statique
        # NEXT_PUBLIC_ est indispensable : ces variables doivent être lisibles
        # à la fois par next.config.ts (build) et par le code qui tourne dans
        # le navigateur — voir next.config.ts et src/lib/shopify.ts.
        # Règle les valeurs Shopify dans :
        #   GitHub → Settings → Secrets and variables → Actions → onglet "Variables"
        # (le jeton Storefront est PUBLIC par conception ; aucun secret Admin ici)
        env:
          NEXT_PUBLIC_GITHUB_PAGES: "true"
          NEXT_PUBLIC_SHOPIFY_DOMAIN: ${{ vars.NEXT_PUBLIC_SHOPIFY_DOMAIN }}
          NEXT_PUBLIC_SHOPIFY_STOREFRONT_TOKEN: ${{ vars.NEXT_PUBLIC_SHOPIFY_STOREFRONT_TOKEN }}
          NEXT_PUBLIC_SHOPIFY_PRODUCT_HANDLE: ${{ vars.NEXT_PUBLIC_SHOPIFY_PRODUCT_HANDLE }}
          NEXT_PUBLIC_SHOPIFY_HANDLE_NAVY: ${{ vars.NEXT_PUBLIC_SHOPIFY_HANDLE_NAVY }}
          NEXT_PUBLIC_SHOPIFY_HANDLE_WHITE: ${{ vars.NEXT_PUBLIC_SHOPIFY_HANDLE_WHITE }}
          NEXT_PUBLIC_SHOPIFY_HANDLE_BLACK: ${{ vars.NEXT_PUBLIC_SHOPIFY_HANDLE_BLACK }}
          NEXT_PUBLIC_SHOPIFY_API_VERSION: ${{ vars.NEXT_PUBLIC_SHOPIFY_API_VERSION }}
        run: npm run build

      - name: Marquer le dossier comme statique (pas de traitement Jekyll)
        run: touch ./out/.nojekyll

      - name: Préparer l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
